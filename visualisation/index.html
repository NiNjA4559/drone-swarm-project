<!DOCTYPE html>
<html>
<head>
    <title>Drone Swarm Simulation</title>
    <style>
        canvas { border: 1px solid black; display: block; margin: 20px; }
        body { font-family: Arial; padding: 20px; }
    </style>
</head>
<body>
    <h1>Drone Swarm Simulation</h1>
    <div>
        Tick: <span id="tick">0</span> | 
        <button onclick="prevTick()">Previous</button>
        <button onclick="nextTick()">Next</button>
    </div>
    <canvas id="canvas" width="600" height="600"></canvas>
    
    <script src="./simulation.js"></script>
    <script>
        let currentTick = 0;
        let frames = simulationData || [];
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function loadTick(index) {
            if (!frames[index]) {
                console.log('Tick ' + index + ' not found');
                return;
            }

            const data = frames[index];
            drawSimulation(data);
            currentTick = index;
            document.getElementById('tick').textContent = data.tick;
        }

        function getDroneColor(ability) {
            switch (ability) {
                case 0: return '#808080';
                case 1: return '#1e90ff';
                case 2: return '#ff8c00';
                case 3: return '#8a2be2';
                default: return '#00ff00';
            }
        }

        function drawSimulation(data) {
            const gridSize = data.grid_size;
            const cellSize = canvas.width / gridSize;

            // Clear canvas
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid
            ctx.strokeStyle = '#ddd';
            for(let i = 0; i <= gridSize; i++) {
                ctx.beginPath();
                ctx.moveTo(i * cellSize, 0);
                ctx.lineTo(i * cellSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * cellSize);
                ctx.lineTo(canvas.width, i * cellSize);
                ctx.stroke();
            }

            // Draw entities
            data.entities.forEach(entity => {
                if(entity.functional) {
                    const x = entity.x * cellSize + cellSize / 2;
                    const y = canvas.height - (entity.y * cellSize + cellSize / 2);
                    ctx.fillStyle = getDroneColor(entity.ability);
                    ctx.beginPath();
                    ctx.arc(x, y, 8, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.fillStyle = 'black';
                    ctx.font = '12px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(entity.id, x, y + 4);
                }
            });
        }

        function nextTick() {
            if (currentTick < frames.length - 1) {
                loadTick(currentTick + 1);
            }
        }

        function prevTick() {
            if (currentTick > 0) {
                loadTick(currentTick - 1);
            }
        }

        if (frames.length > 0) {
            loadTick(0);
        }
    </script>
</body>
</html>
