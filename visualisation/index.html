<!DOCTYPE html>
<html>
<head>
    <title>Drone Swarm Simulation</title>
    <style>
        canvas { border: 1px solid black; display: block; margin: 20px 0; }
        body { font-family: Arial; padding: 20px; }
        .controls {
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 32px;
        }
        #tick {
            display: inline-block;
            width: 72px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }
        .controls button {
            width: 82px;
            height: 30px;
        }
        .speed-control {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 8px;
        }
        #speed {
            width: 110px;
        }
        #speed-value {
            display: inline-block;
            width: 34px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        .topology-control {
            margin-left: 8px;
        }
        #topology-status {
            margin: 8px 0 0;
            color: #596273;
            font-size: 13px;
            font-variant-numeric: tabular-nums;
        }
        #metrics-status {
            margin: 4px 0 12px;
            color: #596273;
            font-size: 13px;
            font-variant-numeric: tabular-nums;
        }
        #benchmark-chart {
            display: block;
            margin: 12px 0;
            border: 1px solid #d9dee7;
        }
        #benchmark-table {
            border-collapse: collapse;
            margin: 8px 0 24px;
            font-size: 13px;
        }
        #benchmark-table th, #benchmark-table td {
            border: 1px solid #d9dee7;
            padding: 6px 10px;
            text-align: right;
        }
        #benchmark-table th:first-child, #benchmark-table td:first-child {
            text-align: left;
        }
    </style>
</head>
<body>
    <h1>Drone Swarm Simulation</h1>
    <div class="controls">
        <span>Tick:</span>
        <span id="tick">0</span>
        <button onclick="prevTick()">Previous</button>
        <button onclick="nextTick()">Next</button>
        <button id="autoplay" onclick="toggleAutoplay()">Autoplay</button>
        <label class="speed-control" for="speed">
            <span>Speed</span>
            <input id="speed" type="range" min="0.25" max="3" step="0.25" value="1" oninput="setAnimationSpeed(this.value)">
            <span id="speed-value">1x</span>
        </label>
        <label class="topology-control">
            <input id="show-topology" type="checkbox" checked onchange="renderFrame(currentTick)">
            Topology
        </label>
    </div>
    <div id="topology-status" aria-live="polite"></div>
    <div id="metrics-status" aria-live="polite"></div>
    <canvas id="canvas" width="600" height="600"></canvas>

    <h2>Benchmark History</h2>
    <p id="benchmark-empty" style="color:#596273; font-size:13px;">No benchmark runs recorded yet. Run <code>mingw32-make run LABEL="description of change"</code> to add one against the fixed testcase.</p>
    <canvas id="benchmark-chart" width="900" height="220"></canvas>
    <table id="benchmark-table">
        <thead>
            <tr>
                <th>Label</th>
                <th>Timestamp</th>
                <th>Ticks</th>
                <th>Moves</th>
                <th>Completed / Created</th>
                <th>Query Time (ns)</th>
                <th>Sim Time (ns)</th>
            </tr>
        </thead>
        <tbody id="benchmark-table-body"></tbody>
    </table>

    <script src="./simulation.js"></script>
    <script src="./benchmarks.js"></script>
    <script>
        const frames = simulationData || [];
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const baseAnimationDuration = 650;
        let currentTick = 0;
        let animationFrame = null;
        let autoplaying = false;
        let autoplayTimer = null;
        let animationSpeed = 1;
        const defaultCommunicationRange = 3;

        function setAnimationSpeed(value) {
            animationSpeed = Number(value);
            document.getElementById('speed-value').textContent = animationSpeed + 'x';
        }

        function getDroneColor(ability) {
            switch (ability) {
                case 0: return '#808080';
                case 1: return '#1e90ff';
                case 2: return '#ff8c00';
                case 3: return '#8a2be2';
                default: return '#00a896';
            }
        }

        function getCellOffsets(data) {
            const groups = new Map();
            const offsets = new Map();

            data.entities.forEach(entity => {
                const cell = entity.x + ',' + entity.y;
                if (!groups.has(cell)) groups.set(cell, []);
                groups.get(cell).push(entity);
            });

            groups.forEach(entities => {
                entities.sort((first, second) => first.id - second.id);
                const spacing = Math.min(18, (canvas.width / data.grid_size) * 0.44);
                const columns = Math.ceil(Math.sqrt(entities.length));
                const rows = Math.ceil(entities.length / columns);
                const centerColumn = (columns - 1) / 2;
                const centerRow = (rows - 1) / 2;

                entities.forEach((entity, index) => {
                    const column = index % columns;
                    const row = Math.floor(index / columns);
                    offsets.set(entity.id, {
                        x: (column - centerColumn) * spacing,
                        y: (row - centerRow) * spacing
                    });
                });
            });

            return offsets;
        }

        function getTaskOffsets(data) {
            const groups = new Map();
            const offsets = new Map();

            (data.tasks || []).forEach(task => {
                const cell = task.x + ',' + task.y;
                if (!groups.has(cell)) groups.set(cell, []);
                groups.get(cell).push(task);
            });

            groups.forEach(tasks => {
                tasks.sort((first, second) => first.id - second.id);
                const cellSize = canvas.width / data.grid_size;
                const spacing = Math.min(12, cellSize * 0.3);
                const columns = Math.ceil(Math.sqrt(tasks.length));
                const centerColumn = (columns - 1) / 2;
                const centerRow = (Math.ceil(tasks.length / columns) - 1) / 2;

                tasks.forEach((task, index) => {
                    offsets.set(task.id, {
                        x: (index % columns - centerColumn) * spacing,
                        y: (Math.floor(index / columns) - centerRow) * spacing
                    });
                });
            });

            return offsets;
        }

        function getEntityPosition(entity, data, offsets, progress) {
            const cellSize = canvas.width / data.grid_size;
            const offset = offsets.get(entity.id) || { x: 0, y: 0 };
            return {
                x: entity.x * cellSize + cellSize / 2 + offset.x,
                y: canvas.height - (entity.y * cellSize + cellSize / 2) + offset.y,
                progress
            };
        }

        function drawGrid(data) {
            const cellSize = canvas.width / data.grid_size;

            ctx.fillStyle = '#f7f8fa';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#d9dee7';
            ctx.lineWidth = 1;

            for(let index = 0; index <= data.grid_size; index++) {
                ctx.beginPath();
                ctx.moveTo(index * cellSize, 0);
                ctx.lineTo(index * cellSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, index * cellSize);
                ctx.lineTo(canvas.width, index * cellSize);
                ctx.stroke();
            }
        }

        function getTaskTypeColor(type) {
            return getDroneColor(type);
        }

        function drawTasks(data, entityPositions) {
            const cellSize = canvas.width / data.grid_size;
            const markerSize = Math.max(2, Math.min(6, cellSize * 0.22));
            const labelSize = Math.max(7, Math.min(11, cellSize * 0.38));
            const taskOffsets = getTaskOffsets(data);

            (data.tasks || []).forEach(task => {
                const offset = taskOffsets.get(task.id) || { x: 0, y: 0 };
                const x = task.x * cellSize + cellSize / 2 + offset.x;
                const y = canvas.height - (task.y * cellSize + cellSize / 2) + offset.y;
                const assignedPosition = entityPositions.get(task.assigned_to);

                if (task.assigned && assignedPosition) {
                    ctx.strokeStyle = '#7b8190';
                    ctx.lineWidth = Math.max(0.7, Math.min(1.5, cellSize * 0.05));
                    ctx.setLineDash([5, 4]);
                    ctx.beginPath();
                    ctx.moveTo(assignedPosition.x, assignedPosition.y);
                    ctx.lineTo(x, y);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }

                ctx.fillStyle = getTaskTypeColor(task.type);
                ctx.fillRect(x - markerSize, y - markerSize, markerSize * 2, markerSize * 2);
                ctx.fillStyle = '#20252d';
                ctx.font = labelSize + 'px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('T' + task.id, x, y - markerSize - 2);
            });
        }

        function getCommunicationRange(data) {
            return Number(data.communication_range ?? data.range ?? defaultCommunicationRange);
        }

        function getNetwork(data) {
            const entities = data.entities.filter(entity => entity.functional);
            const parent = new Map(entities.map(entity => [entity.id, entity.id]));
            const edges = [];

            function find(id) {
                let root = id;
                while (parent.get(root) !== root) root = parent.get(root);
                while (parent.get(id) !== id) {
                    const next = parent.get(id);
                    parent.set(id, root);
                    id = next;
                }
                return root;
            }

            function unite(firstId, secondId) {
                const firstRoot = find(firstId);
                const secondRoot = find(secondId);
                if (firstRoot !== secondRoot) parent.set(secondRoot, firstRoot);
            }

            const range = getCommunicationRange(data);
            for (let first = 0; first < entities.length; first++) {
                for (let second = first + 1; second < entities.length; second++) {
                    const firstEntity = entities[first];
                    const secondEntity = entities[second];
                    const distance = Math.abs(firstEntity.x - secondEntity.x)
                        + Math.abs(firstEntity.y - secondEntity.y);
                    if (distance <= range) {
                        edges.push([firstEntity.id, secondEntity.id]);
                        unite(firstEntity.id, secondEntity.id);
                    }
                }
            }

            const components = new Map();
            entities.forEach(entity => {
                const root = find(entity.id);
                if (!components.has(root)) components.set(root, []);
                components.get(root).push(entity);
            });

            const componentList = [...components.values()];
            const componentByEntity = new Map();
            componentList.forEach((component, index) => {
                component.forEach(entity => componentByEntity.set(entity.id, index));
            });

            return { edges, components: componentList, componentByEntity, range };
        }

        function getHull(points, padding) {
            if (points.length <= 1) return points;
            const sorted = [...points].sort((first, second) => first.x - second.x || first.y - second.y);
            const cross = (origin, first, second) =>
                (first.x - origin.x) * (second.y - origin.y)
                - (first.y - origin.y) * (second.x - origin.x);
            const lower = [];
            const upper = [];

            sorted.forEach(point => {
                while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0) {
                    lower.pop();
                }
                lower.push(point);
            });
            [...sorted].reverse().forEach(point => {
                while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0) {
                    upper.pop();
                }
                upper.push(point);
            });

            const hull = lower.slice(0, -1).concat(upper.slice(0, -1));
            const center = hull.reduce((sum, point) => ({
                x: sum.x + point.x / hull.length,
                y: sum.y + point.y / hull.length
            }), { x: 0, y: 0 });
            return hull.map(point => {
                const length = Math.hypot(point.x - center.x, point.y - center.y) || 1;
                return {
                    x: point.x + (point.x - center.x) * padding / length,
                    y: point.y + (point.y - center.y) * padding / length
                };
            });
        }

        function drawTopology(data, positions) {
            const network = getNetwork(data);
            const cellSize = canvas.width / data.grid_size;
            const lineWidth = Math.max(0.7, Math.min(1.5, cellSize * 0.05));
            const componentColors = ['#168aad', '#e76f51', '#7b2cbf', '#2a9d8f', '#e9c46a'];
            const componentFills = [
                'rgba(22, 138, 173, 0.045)',
                'rgba(231, 111, 81, 0.045)',
                'rgba(123, 44, 191, 0.045)',
                'rgba(42, 157, 143, 0.045)',
                'rgba(233, 196, 106, 0.08)'
            ];
            const positionById = new Map([...positions].map(([entity, position]) => [entity.id, position]));

            ctx.save();
            network.edges.forEach(([firstId, secondId]) => {
                const first = positionById.get(firstId);
                const second = positionById.get(secondId);
                if (!first || !second) return;
                const componentIndex = network.componentByEntity.get(firstId);
                ctx.strokeStyle = componentColors[componentIndex % componentColors.length];
                ctx.globalAlpha = 0.58;
                ctx.lineWidth = lineWidth;
                ctx.beginPath();
                ctx.moveTo(first.x, first.y);
                ctx.lineTo(second.x, second.y);
                ctx.stroke();
            });

            network.components.forEach((component, index) => {
                const points = component.map(entity => positions.get(entity)).filter(Boolean);
                const hull = getHull(points, cellSize * 0.45);
                if (!hull.length) return;
                const color = componentColors[index % componentColors.length];
                ctx.strokeStyle = color;
                ctx.fillStyle = componentFills[index % componentFills.length];
                ctx.lineWidth = lineWidth;
                ctx.globalAlpha = 0.78;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                if (hull.length === 1) {
                    const entityRadius = Math.max(2, Math.min(8, cellSize * 0.2));
                    ctx.arc(hull[0].x, hull[0].y, entityRadius + cellSize * 0.22, 0, 2 * Math.PI);
                } else {
                    ctx.moveTo(hull[0].x, hull[0].y);
                    hull.slice(1).forEach(point => ctx.lineTo(point.x, point.y));
                    ctx.closePath();
                }
                ctx.fill();
                ctx.stroke();
            });
            ctx.restore();

            const status = document.getElementById('topology-status');
            status.textContent = 'Topology: ' + network.components.length
                + ' component' + (network.components.length === 1 ? '' : 's')
                + ' | ' + network.edges.length + ' link' + (network.edges.length === 1 ? '' : 's')
                + ' | range ' + network.range;
        }

        function drawEntities(data, positions, opacityById) {
            const cellSize = canvas.width / data.grid_size;
            const radius = Math.max(2, Math.min(8, cellSize * 0.2));
            const labelSize = Math.max(7, Math.min(12, cellSize * 0.4));
            positions.forEach((position, entity) => {
            const opacity = opacityById.get(entity.id) ?? (entity.functional ? 1 : 0);
            if (opacity <= 0) return;
            ctx.save();
            ctx.globalAlpha = opacity;
            ctx.fillStyle = entity.functional ? getDroneColor(entity.ability) : '#9aa0aa';
                ctx.beginPath();
                ctx.arc(position.x, position.y, radius, 0, 2 * Math.PI);
                ctx.fill();

                if (!entity.functional) {
                    ctx.strokeStyle = '#b00020';
                    ctx.lineWidth = Math.max(1, radius * 0.22);
                    ctx.beginPath();
                    ctx.moveTo(position.x - radius * 0.7, position.y - radius * 0.7);
                    ctx.lineTo(position.x + radius * 0.7, position.y + radius * 0.7);
                    ctx.moveTo(position.x + radius * 0.7, position.y - radius * 0.7);
                    ctx.lineTo(position.x - radius * 0.7, position.y + radius * 0.7);
                    ctx.stroke();
                }

                ctx.fillStyle = '#20252d';
                ctx.font = labelSize + 'px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(entity.id, position.x, position.y + labelSize * 0.32);
                ctx.restore();
            });
        }

        function drawSimulation(startData, endData, progress) {
            const startOffsets = getCellOffsets(startData);
            const endOffsets = getCellOffsets(endData);
            const startEntities = new Map(startData.entities.map(entity => [entity.id, entity]));
            const endEntities = new Map(endData.entities.map(entity => [entity.id, entity]));
            const positions = new Map();
            const endPositions = new Map();
            const opacityById = new Map();

            const entityIds = new Set([...startEntities.keys(), ...endEntities.keys()]);
            entityIds.forEach(entityId => {
                const startEntity = startEntities.get(entityId) || endEntities.get(entityId);
                const endEntity = endEntities.get(entityId) || startEntity;
                const startPosition = getEntityPosition(startEntity, startData, startOffsets, progress);
                const endPosition = getEntityPosition(endEntity, endData, endOffsets, progress);
                const position = {
                    x: startPosition.x + (endPosition.x - startPosition.x) * progress,
                    y: startPosition.y + (endPosition.y - startPosition.y) * progress
                };
                positions.set(endEntity, position);
                endPositions.set(endEntity.id, position);
                const wasFunctional = Boolean(startEntity.functional);
                const isFunctional = Boolean(endEntity.functional);
                opacityById.set(entityId, wasFunctional === isFunctional
                    ? (isFunctional ? 1 : 0)
                    : (isFunctional ? progress : 1 - progress));
            });

            drawGrid(endData);
            if (document.getElementById('show-topology').checked) {
                drawTopology(endData, positions);
            }
            const metrics = endData.metrics || {};
            document.getElementById('metrics-status').textContent = 'Metrics: '
                + (metrics.moves ?? 0) + ' moves | '
                + (metrics.tasks_completed ?? 0) + ' completed / '
                + (metrics.tasks_created ?? 0) + ' created | '
                + (metrics.active_tasks ?? 0) + ' active | '
                + (metrics.simulation_time_ns ?? 0) + ' ns simulation | '
                + (metrics.query_time_ns ?? 0) + ' ns queries';
            drawTasks(endData, endPositions);
            drawEntities(endData, positions, opacityById);
            document.getElementById('tick').textContent = progress < 1
                ? startData.tick + ' -> ' + endData.tick
                : endData.tick;
        }

        function renderFrame(index) {
            drawSimulation(frames[index], frames[index], 1);
            currentTick = index;
        }

        function animateTo(index, onComplete) {
            if(index < 0 || index >= frames.length || index === currentTick) {
                if(onComplete) onComplete();
                return;
            }
            if(animationFrame !== null) cancelAnimationFrame(animationFrame);

            const startIndex = currentTick;
            const startTime = performance.now();
            const animationDuration = baseAnimationDuration / animationSpeed;

            function animate(timestamp) {
                const progress = Math.min(1, (timestamp - startTime) / animationDuration);
                drawSimulation(frames[startIndex], frames[index], progress);

                if(progress < 1) {
                    animationFrame = requestAnimationFrame(animate);
                } else {
                    animationFrame = null;
                    currentTick = index;
                    document.getElementById('tick').textContent = frames[index].tick;
                    if(onComplete) onComplete();
                }
            }

            animationFrame = requestAnimationFrame(animate);
        }

        function nextTick() {
            animateTo(currentTick + 1);
        }

        function prevTick() {
            animateTo(currentTick - 1);
        }

        function toggleAutoplay() {
            if(autoplaying) {
                autoplaying = false;
                clearTimeout(autoplayTimer);
                autoplayTimer = null;
                document.getElementById('autoplay').textContent = 'Autoplay';
                return;
            }

            autoplaying = true;
            document.getElementById('autoplay').textContent = 'Pause';
            playNextTick();
        }

        function playNextTick() {
            if(!autoplaying) return;

            if(currentTick >= frames.length - 1) {
                toggleAutoplay();
                return;
            }

            animateTo(currentTick + 1, () => {
                autoplayTimer = setTimeout(playNextTick, 250 / animationSpeed);
            });
        }

        if(frames.length > 0) renderFrame(0);

        function renderBenchmarkChart(history) {
            const chartCanvas = document.getElementById('benchmark-chart');
            const chartCtx = chartCanvas.getContext('2d');
            chartCtx.clearRect(0, 0, chartCanvas.width, chartCanvas.height);

            const padding = 40;
            const chartWidth = chartCanvas.width - padding * 2;
            const chartHeight = chartCanvas.height - padding * 2;
            const barGroupWidth = chartWidth / history.length;
            const maxSimTime = Math.max(...history.map(run => run.total_simulation_time_ns || 0), 1);

            chartCtx.strokeStyle = '#d9dee7';
            chartCtx.beginPath();
            chartCtx.moveTo(padding, padding);
            chartCtx.lineTo(padding, padding + chartHeight);
            chartCtx.lineTo(padding + chartWidth, padding + chartHeight);
            chartCtx.stroke();

            chartCtx.fillStyle = '#20252d';
            chartCtx.font = '11px Arial';
            chartCtx.textAlign = 'left';
            chartCtx.fillText('Total simulation time (ns) per run (latest run highlighted)', padding, padding - 12);

            history.forEach((run, index) => {
                const barWidth = Math.min(48, barGroupWidth * 0.6);
                const barHeight = ((run.total_simulation_time_ns || 0) / maxSimTime) * chartHeight;
                const x = padding + index * barGroupWidth + (barGroupWidth - barWidth) / 2;
                const y = padding + chartHeight - barHeight;

                chartCtx.fillStyle = index === history.length - 1 ? '#1e90ff' : '#8a2be2';
                chartCtx.fillRect(x, y, barWidth, barHeight);

                chartCtx.fillStyle = '#596273';
                chartCtx.textAlign = 'center';
                chartCtx.font = '10px Arial';
                const rawLabel = run.label || '';
                const label = rawLabel.length > 10 ? rawLabel.slice(0, 9) + '\u2026' : rawLabel;
                chartCtx.fillText(label, x + barWidth / 2, padding + chartHeight + 14);
            });
        }

        function renderBenchmarkTable(history) {
            const body = document.getElementById('benchmark-table-body');
            body.innerHTML = '';

            history.forEach(run => {
                const row = document.createElement('tr');
                const cells = [
                    run.label ?? '',
                    run.timestamp ?? '',
                    run.ticks ?? '',
                    run.total_moves ?? 0,
                    (run.tasks_completed ?? 0) + ' / ' + (run.tasks_created ?? 0),
                    run.total_query_time_ns ?? 0,
                    run.total_simulation_time_ns ?? 0
                ];
                cells.forEach(value => {
                    const cell = document.createElement('td');
                    cell.textContent = String(value);
                    row.appendChild(cell);
                });
                body.appendChild(row);
            });
        }

        function renderBenchmarks() {
            const history = (typeof benchmarkData !== 'undefined' && benchmarkData) || [];
            const hasHistory = history.length > 0;

            document.getElementById('benchmark-empty').style.display = hasHistory ? 'none' : 'block';
            document.getElementById('benchmark-chart').style.display = hasHistory ? 'block' : 'none';
            document.getElementById('benchmark-table').style.display = hasHistory ? 'table' : 'none';

            if (!hasHistory) return;

            renderBenchmarkChart(history);
            renderBenchmarkTable(history);
        }

        renderBenchmarks();
    </script>
</body>
</html>
